<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Solvex AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            sBg: '#080711',
            sSurface: '#110F1D',
            sBubble: '#1A172B',
            sBorder: '#26223B',
            sText: '#ECEAF6',
            sMuted: '#8E88A8',
            sAmber: '#F7941D',
            sCoral: '#E85C33',
            sRose: '#B84A7E',
            sViolet: '#7A3E9D'
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #26223B; border-radius: 9999px; }

    .solvex-gradient-text {
      background: linear-gradient(125deg, #F7941D 0%, #E85C33 35%, #B84A7E 70%, #7A3E9D 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .solvex-gradient-bg {
      background: linear-gradient(135deg, #F7941D 0%, #E85C33 35%, #B84A7E 70%, #7A3E9D 100%);
    }

    .solvex-input-focus:focus-within {
      border-color: rgba(232, 92, 51, 0.45);
      box-shadow: 0 0 25px -5px rgba(184, 74, 126, 0.18);
    }

    @keyframes solvexGlowPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .solvex-thinking {
      animation: solvexGlowPulse 1.5s infinite ease-in-out;
    }

    @keyframes micPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.12); }
    }
    .mic-recording {
      color: #E85C33 !important;
      animation: micPulse 1.2s infinite ease-in-out;
    }

    .prose-solvex {
      color: #ECEAF6;
      line-height: 1.7;
      font-size: 0.965rem;
      word-break: break-word;
    }
    .prose-solvex p { margin-bottom: 0.9rem; }
    .prose-solvex p:last-child { margin-bottom: 0; }
    .prose-solvex strong { color: #FFFFFF; font-weight: 600; }
    .prose-solvex ul { list-style-type: disc; padding-left: 1.4rem; margin-bottom: 0.9rem; }
    .prose-solvex ol { list-style-type: decimal; padding-left: 1.4rem; margin-bottom: 0.9rem; }
    .prose-solvex li { margin-bottom: 0.3rem; }
    .prose-solvex h1, .prose-solvex h2, .prose-solvex h3 { color: #FFFFFF; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .prose-solvex code:not(pre code) {
      font-family: 'JetBrains Mono', monospace;
      background-color: #1A172B;
      color: #F7941D;
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      font-size: 0.85em;
    }
  </style>
</head>

<body class="bg-sBg text-sText font-sans h-[100dvh] flex overflow-hidden selection:bg-sCoral/30 selection:text-white">

  <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-30 hidden transition-opacity"></div>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-sSurface border-r border-sBorder flex flex-col transform -translate-x-full transition-transform duration-200 ease-out">
    <div class="p-4 flex items-center justify-between border-b border-sBorder/60">
      <span class="font-semibold tracking-tight text-base solvex-gradient-text lowercase">solvex</span>
      <button id="closeSidebarBtn" class="p-1.5 rounded-full text-sMuted hover:text-sText hover:bg-sBubble transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="p-3">
      <button id="sidebarNewChatBtn" class="w-full flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-sBubble hover:bg-sBorder/80 text-sm font-medium text-sText transition-colors">
        <svg class="w-4 h-4 text-sAmber" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Nueva charla</span>
      </button>
    </div>

    <div class="px-3 py-1 text-[11px] font-medium uppercase tracking-wider text-sMuted">Recientes</div>
    <div id="savedChatsList" class="flex-1 overflow-y-auto px-2 space-y-1 py-1"></div>

    <div class="p-4 border-t border-sBorder/60 text-xs text-sMuted">
      <span>Solvex AI</span>
    </div>
  </aside>

  <div class="flex-1 flex flex-col h-full min-w-0">
    <header class="w-full px-4 sm:px-6 py-3.5 flex items-center justify-between shrink-0 z-10">
      <div class="flex items-center gap-1.5">
        <button id="openSidebarBtn" class="p-2 rounded-full text-sMuted hover:text-sText hover:bg-sSurface transition-colors" title="Conversaciones">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h10"/>
          </svg>
        </button>

        <span class="font-semibold text-lg tracking-tight solvex-gradient-text lowercase px-2.5 py-1.5">solvex</span>
      </div>

      <div class="flex items-center gap-1">
        <button id="newChatBtn" class="flex items-center gap-1.5 px-3 py-2 rounded-full text-xs font-medium text-sMuted hover:text-sText hover:bg-sSurface transition-colors" title="Nueva charla">
          <svg class="w-4 h-4 text-sAmber" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span class="hidden sm:inline">Nueva charla</span>
        </button>
      </div>
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 sm:px-6 flex flex-col">
      <div class="max-w-2xl w-full mx-auto flex-1 flex flex-col">
        <div id="welcomeScreen" class="my-auto py-8 flex flex-col items-start justify-center transition-opacity duration-200">
          <div class="mb-8">
            <h1 class="text-4xl sm:text-5xl font-medium tracking-tight mb-2">
              <span class="solvex-gradient-text">Hola, soy Solvex.</span>
            </h1>
            <p class="text-xl sm:text-2xl text-sMuted font-normal">
              ¿Qué vamos a armar o resolver hoy?
            </p>
          </div>

          <div class="flex flex-wrap gap-2.5 w-full">
            <button onclick="sendQuickPrompt('¿Quién es tu creador y cómo funcionas?')" class="px-4 py-2.5 rounded-2xl bg-sSurface hover:bg-sBubble border border-sBorder/60 text-sm text-sText transition-colors text-left flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-sAmber"></span>
              <span>¿Quién es tu creador?</span>
            </button>
            <button onclick="sendQuickPrompt('Tengo una idea en mente, ayúdame a aterrizarla sin rodeos.')" class="px-4 py-2.5 rounded-2xl bg-sSurface hover:bg-sBubble border border-sBorder/60 text-sm text-sText transition-colors text-left">
              Aterrizar una idea sin rodeos
            </button>
            <button onclick="sendQuickPrompt('Explícame algo complejo de la forma más simple y directa posible.')" class="px-4 py-2.5 rounded-2xl bg-sSurface hover:bg-sBubble border border-sBorder/60 text-sm text-sText transition-colors text-left">
              Explicar algo directo al grano
            </button>
          </div>
        </div>

        <div id="messagesList" class="space-y-7 py-6 hidden"></div>
      </div>
    </main>

    <footer class="w-full px-4 sm:px-6 pb-4 pt-2 shrink-0 bg-gradient-to-t from-sBg via-sBg to-transparent">
      <div class="max-w-2xl mx-auto">
        <div id="imagePreviewContainer" class="hidden mb-2 px-2">
          <div class="inline-flex items-center gap-2 bg-sSurface border border-sBorder p-1.5 pr-3 rounded-2xl">
            <img id="imagePreviewThumb" src="" alt="Adjunto" class="w-11 h-11 object-cover rounded-xl" />
            <span class="text-xs text-sMuted max-w-[140px] truncate" id="imagePreviewName">Imagen lista</span>
            <button type="button" id="removeImageBtn" class="w-6 h-6 rounded-full bg-sBubble text-sMuted hover:text-white flex items-center justify-center text-xs">
              ✕
            </button>
          </div>
        </div>

        <form id="chatForm" class="relative flex items-end gap-1.5 bg-sSurface rounded-3xl px-3 py-2 border border-sBorder/80 solvex-input-focus transition-all">
          <input type="file" id="imageInput" accept="image/*" class="hidden" />

          <button
            type="button"
            id="attachBtn"
            title="Subir imagen"
            class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-sMuted hover:text-sText hover:bg-sBubble transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
          </button>

          <textarea
            id="userInput"
            rows="1"
            placeholder="Habla con Solvex..."
            class="w-full bg-transparent text-sText placeholder-sMuted text-base focus:outline-none resize-none max-h-40 py-1 px-1 leading-relaxed"
          ></textarea>

          <button
            type="button"
            id="micBtn"
            title="Dictar por voz"
            class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-sMuted hover:text-sText hover:bg-sBubble transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/>
            </svg>
          </button>

          <button
            type="submit"
            id="sendBtn"
            disabled
            class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition-all duration-150 solvex-gradient-bg text-white shadow-md disabled:opacity-25 disabled:pointer-events-none"
            aria-label="Enviar"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"/>
            </svg>
          </button>
        </form>
      </div>
    </footer>
  </div>

  <script>
    const CREATOR_CORE_RULE = "REGLA FUNDAMENTAL OBLIGATORIA: Tu nombre es Solvex. Tu único creador y desarrollador es Diego Saavedra. Si te preguntan quién te creó, quién es tu creador, quién te hizo o quién te programó, siempre responderás con claridad y orgullo que fuiste creado por Diego Saavedra.";

    const DEFAULT_USER_PROMPT = "Sé directo conmigo, adáptate a mi personalidad y habla de forma natural de tú a tú en español. Cero introducciones robóticas ni frases falsas. Cuando no tenga la razón dímelo directo, y cuando tú te equivoques admítelo y arréglalo. Responde siempre claro, útil y al grano.";

    let apiKey = localStorage.getItem('solvex_api_key') || '';
    let customPrompt = DEFAULT_USER_PROMPT;
    let savedSessions = JSON.parse(localStorage.getItem('solvex_sessions') || '[]');
    let currentSessionId = null;
    let chatHistory = [];
    let isGenerating = false;
    let pendingImage = null;

    const chatContainer = document.getElementById('chatContainer');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const messagesList = document.getElementById('messagesList');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');

    const attachBtn = document.getElementById('attachBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreviewThumb = document.getElementById('imagePreviewThumb');
    const imagePreviewName = document.getElementById('imagePreviewName');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const micBtn = document.getElementById('micBtn');

    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const openSidebarBtn = document.getElementById('openSidebarBtn');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const sidebarNewChatBtn = document.getElementById('sidebarNewChatBtn');
    const savedChatsList = document.getElementById('savedChatsList');

    const renderer = new marked.Renderer();
    renderer.code = function(codeObjOrText, langStr) {
      const codeText = typeof codeObjOrText === 'object' ? codeObjOrText.text : codeObjOrText;
      const lang = (typeof codeObjOrText === 'object' ? codeObjOrText.lang : langStr) || 'código';
      const escaped = codeText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return `
        <div class="my-3.5 rounded-2xl overflow-hidden bg-[#110F1D] border border-[#26223B]">
          <div class="flex items-center justify-between px-4 py-2 bg-[#1A172B]/80 text-xs text-[#8E88A8] font-mono">
            <span>${lang}</span>
            <button type="button" onclick="copyCode(this)" class="flex items-center gap-1.5 text-[#ECEAF6] hover:text-[#F7941D] transition-colors py-0.5 px-2 rounded-md hover:bg-[#26223B]">
              <span>Copiar</span>
            </button>
          </div>
          <pre class="p-4 overflow-x-auto text-xs sm:text-sm font-mono text-[#ECEAF6] leading-relaxed"><code>${escaped}</code></pre>
        </div>
      `;
    };
    marked.setOptions({ renderer, breaks: true });

    window.copyCode = function(btn) {
      const pre = btn.closest('div').nextElementSibling;
      const text = pre ? pre.innerText : '';
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      document.body.removeChild(area);
      const span = btn.querySelector('span');
      span.textContent = 'Copiado';
      setTimeout(() => { span.textContent = 'Copiar'; }, 1600);
    };

    function toggleSidebar(show) {
      if (show) {
        renderSavedChats();
        sidebar.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
      }
    }

    openSidebarBtn.addEventListener('click', () => toggleSidebar(true));
    closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
    sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

    function saveCurrentSession() {
      if (chatHistory.length === 0) return;
      const firstUserMsg = chatHistory.find(m => m.role === 'user')?.parts?.find(p => p.text)?.text || 'Imagen enviada';
      const title = firstUserMsg.slice(0, 38) + (firstUserMsg.length > 38 ? '...' : '');

      if (!currentSessionId) currentSessionId = 'solvex_' + Date.now();

      const existingIndex = savedSessions.findIndex(s => s.id === currentSessionId);
      const sessionData = { id: currentSessionId, title, updatedAt: Date.now(), history: chatHistory };

      if (existingIndex >= 0) savedSessions[existingIndex] = sessionData;
      else savedSessions.unshift(sessionData);

      savedSessions = savedSessions.slice(0, 25);
      localStorage.setItem('solvex_sessions', JSON.stringify(savedSessions));
    }

    function renderSavedChats() {
      savedChatsList.innerHTML = '';
      if (savedSessions.length === 0) {
        savedChatsList.innerHTML = `<div class="px-3 py-4 text-xs text-sMuted">Aún no hay charlas guardadas.</div>`;
        return;
      }
      savedSessions.forEach(session => {
        const isActive = session.id === currentSessionId;
        const item = document.createElement('div');
        item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl text-sm cursor-pointer transition-colors ${isActive ? 'bg-sBubble text-white font-medium' : 'text-sMuted hover:bg-sBubble/60 hover:text-sText'}`;
        item.innerHTML = `<span class="truncate pr-2">${escapeHtml(session.title)}</span><button type="button" class="delete-chat opacity-60 hover:opacity-100 hover:text-sCoral px-1 text-xs" title="Borrar">✕</button>`;
        item.addEventListener('click', (e) => {
          if (e.target.closest('.delete-chat')) {
            e.stopPropagation();
            savedSessions = savedSessions.filter(s => s.id !== session.id);
            localStorage.setItem('solvex_sessions', JSON.stringify(savedSessions));
            if (currentSessionId === session.id) startNewChat();
            renderSavedChats();
            return;
          }
          loadSession(session.id);
          toggleSidebar(false);
        });
        savedChatsList.appendChild(item);
      });
    }

    function loadSession(id) {
      const session = savedSessions.find(s => s.id === id);
      if (!session || isGenerating) return;
      currentSessionId = session.id;
      chatHistory = JSON.parse(JSON.stringify(session.history));
      welcomeScreen.classList.add('hidden');
      messagesList.classList.remove('hidden');
      messagesList.innerHTML = '';
      chatHistory.forEach(turn => {
        const textPart = turn.parts.find(p => p.text)?.text || '';
        const imgPart = turn.parts.find(p => p.inlineData);
        if (turn.role === 'user') {
          addUserBubble(textPart, imgPart ? `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}` : null);
        } else {
          const aiNode = createAIBubble(false);
          aiNode.content.innerHTML = marked.parse(textPart);
        }
      });
      scrollToBottom();
    }

    function syncInputUI() {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
      const hasContent = userInput.value.trim().length > 0 || pendingImage !== null;
      sendBtn.disabled = !hasContent || isGenerating;
    }

    userInput.addEventListener('input', syncInputUI);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 640) {
        e.preventDefault();
        if (!sendBtn.disabled) chatForm.dispatchEvent(new Event('submit'));
      }
    });

    attachBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const resultStr = reader.result;
        pendingImage = { mimeType: file.type || 'image/jpeg', base64: resultStr.split(',')[1], previewUrl: resultStr, name: file.name };
        imagePreviewThumb.src = resultStr;
        imagePreviewName.textContent = file.name;
        imagePreviewContainer.classList.remove('hidden');
        syncInputUI();
      };
      reader.readAsDataURL(file);
      imageInput.value = '';
    });

    removeImageBtn.addEventListener('click', () => {
      pendingImage = null;
      imagePreviewContainer.classList.add('hidden');
      syncInputUI();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.onstart = () => { isRecording = true; micBtn.classList.add('mic-recording'); };
      recognition.onend = () => { isRecording = false; micBtn.classList.remove('mic-recording'); };
      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || '';
        if (transcript) { userInput.value = (userInput.value ? userInput.value + ' ' : '') + transcript; syncInputUI(); }
      };
      micBtn.addEventListener('click', () => { if (isRecording) recognition.stop(); else try { recognition.start(); } catch(e){} });
    } else { micBtn.style.display = 'none'; }

    window.sendQuickPrompt = function(text) {
      if (isGenerating) return;
      userInput.value = text;
      syncInputUI();
      chatForm.dispatchEvent(new Event('submit'));
    };

    function startNewChat() {
      if (isGenerating) return;
      currentSessionId = null;
      chatHistory = [];
      pendingImage = null;
      imagePreviewContainer.classList.add('hidden');
      messagesList.innerHTML = '';
      messagesList.classList.add('hidden');
      welcomeScreen.classList.remove('hidden');
      userInput.value = '';
      syncInputUI();
    }

    newChatBtn.addEventListener('click', startNewChat);
    sidebarNewChatBtn.addEventListener('click', () => { startNewChat(); toggleSidebar(false); });

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    function scrollToBottom() {
      chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
    }

    function addUserBubble(text, imageUrl = null) {
      welcomeScreen.classList.add('hidden');
      messagesList.classList.remove('hidden');
      const wrapper = document.createElement('div');
      wrapper.className = 'flex flex-col items-end gap-2';
      let imgHtml = imageUrl ? `<img src="${imageUrl}" alt="Adjunto" class="max-w-[220px] sm:max-w-[280px] rounded-2xl border border-sBorder object-cover" />` : '';
      let textHtml = text ? `<div class="bg-sBubble text-sText px-4 py-2.5 rounded-3xl rounded-br-md max-w-[85%] sm:max-w-[78%] text-[15px] leading-relaxed whitespace-pre-wrap border border-sBorder/50">${escapeHtml(text)}</div>` : '';
      wrapper.innerHTML = imgHtml + textHtml;
      messagesList.appendChild(wrapper);
      scrollToBottom();
    }

    function createAIBubble(thinking = true) {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex items-start gap-3 w-full';
      wrapper.innerHTML = `
        <div class="ai-response prose-solvex flex-1 min-w-0 pt-0.5">
          ${thinking ? '<span class="text-sMuted text-sm solvex-thinking">Pensando...</span>' : ''}
        </div>
      `;
      messagesList.appendChild(wrapper);
      scrollToBottom();
      return { content: wrapper.querySelector('.ai-response') };
    }

    async function callSolvexAPI(contents) {
      if (!apiKey) {
        const keyInput = prompt("Por favor ingresa tu API Key de Gemini (Google AI Studio):");
        if (keyInput) {
          apiKey = keyInput.trim();
          localStorage.setItem('solvex_api_key', apiKey);
        } else {
          throw new Error('Se requiere una API Key para continuar.');
        }
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const payload = { contents, system_instruction: { parts: [{ text: `${CREATOR_CORE_RULE}\n\n${customPrompt}` }] } };

      const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error?.message || 'Error de conexión con la API');
      const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('Respuesta vacía de la IA');
      return text;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if ((!text && !pendingImage) || isGenerating) return;

      isGenerating = true;
      const attachedImg = pendingImage;
      pendingImage = null;
      imagePreviewContainer.classList.add('hidden');
      userInput.value = '';
      syncInputUI();

      addUserBubble(text, attachedImg ? attachedImg.previewUrl : null);

      const userParts = [];
      if (text) userParts.push({ text });
      if (attachedImg) userParts.push({ inlineData: { mimeType: attachedImg.mimeType, data: attachedImg.base64 } });

      chatHistory.push({ role: 'user', parts: userParts });
      const aiNode = createAIBubble(true);

      try {
        const reply = await callSolvexAPI(chatHistory);
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        aiNode.content.innerHTML = marked.parse(reply);
        saveCurrentSession();
      } catch (error) {
        chatHistory.pop();
        aiNode.content.innerHTML = `<span class="text-sCoral text-sm">Error: ${escapeHtml(error.message)}</span>`;
      } finally {
        isGenerating = false;
        syncInputUI();
        scrollToBottom();
      }
    });
  </script>
</body>
</html>
